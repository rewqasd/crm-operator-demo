<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><div class="brand-mark">C</div><div><strong>CRM</strong><small>政企销售工作台</small></div></div>
      <nav class="nav" id="nav"></nav>
      <div class="side-footer">教学演示系统<br>数据核验：2026-07-19</div>
    </aside>
    <section class="main">
      <header class="topbar">
        <div class="crumb"><h1 id="pageTitle">工作台</h1><p id="pageDesc">聚焦线索、商机与回款的全过程管理</p></div>
        <div class="top-actions">
          <button class="play-btn" id="startDemo" data-demo="play"><span class="play-pulse"></span><span>自动演示</span></button>
          <button class="icon-btn reset-btn" id="resetData">↻ 重置数据</button>
          <button class="icon-btn" title="通知">🔔</button>
          <div class="user"><div class="avatar">张</div><div><strong>张经理</strong><small>西安政企销售部</small></div></div>
        </div>
      </header>
      <div class="notice"><span>ⓘ</span><div><strong>教学数据说明：</strong>企业名称、成立日期、行业与登记地域来自公开页面；联系人、号码、需求、预算、评分和跟进过程均为脱敏模拟。公开信息可能变化，请点击每条线索的来源页复核。</div><span class="spacer"></span><span>样本期：2026年1—6月</span></div>
      <main class="content" id="content"></main>
    </section>
  </div>

    function leadList(mode){let arr=state.leads.slice();if(mode==='myleads')arr=arr.filter(l=>l.owner!=='—'&&l.status!=='公海');else if(mode==='pool')arr=arr.filter(l=>l.status==='公海');else arr=arr.filter(l=>l.status!=='已转化');if(filters.city!=='全部')arr=arr.filter(l=>l.city===filters.city);if(filters.industry!=='全部')arr=arr.filter(l=>l.industry===filters.industry);if(filters.status!=='全部')arr=arr.filter(l=>l.status===filters.status);if(filters.q){const q=filters.q.toLowerCase();arr=arr.filter(l=>[l.name,l.city,l.district,l.industry,l.product].some(v=>String(v).toLowerCase().includes(q)))}return arr.sort((a,b)=>b.score-a.score)}

    function chip(type,val){return `<button class="chip ${filters[type]===val?'active':''}" data-filter="${type}" data-value="${esc(val)}">${esc(val)}</button>`}

    function connectCall(){if(!activeCall||activeCall.ended)return;activeCall.connected=true;const status=document.getElementById('callStatus'),wave=document.getElementById('callWave');if(status)status.textContent='通话中 · 已开启合规录音';if(wave)wave.style.visibility='visible';activeCall.interval=setInterval(()=>{if(!activeCall)return;activeCall.seconds++;const t=document.getElementById('callTimer');if(t)t.textContent=`${String(Math.floor(activeCall.seconds/60)).padStart(2,'0')}:${String(activeCall.seconds%60).padStart(2,'0')}`},1000);callTranscript().forEach((line,i)=>activeCall.timers.push(setTimeout(()=>appendTranscript(line,i),700+i*2100)))}

    function endCall(quiet=false){if(!activeCall||activeCall.ended)return;activeCall.ended=true;clearInterval(activeCall.interval);activeCall.timers.forEach(clearTimeout);const result=(document.getElementById('callResult')||{}).value||'需求明确',next=(document.getElementById('callNext')||{}).value||'T+2天二次跟进',note=(document.getElementById('callNote')||{}).value||'确认办公网络、云资源及安全接入需求',duration=Math.max(activeCall.seconds,24),durationText=`${String(Math.floor(duration/60)).padStart(2,'0')}:${String(duration%60).padStart(2,'0')}`,id=`call-phone-${activeCall.leadId||activeCall.customer.slice(0,6)}`;upsert(state.calls,{id,customer:activeCall.customer,phone:activeCall.phone,direction:'呼出',time:'刚刚',duration:durationText,result,quality:94,recording:true,summary:note,transcript:activeCall.lines.length?activeCall.lines:callTranscript()});if(activeCall.leadId){const l=findLead(activeCall.leadId);if(l){if(l.owner==='—')claimLead(l.id,true);l.status='跟进中';l.intent='高';l.followups=l.followups||[];l.followups.push({time:'T+0',text:`电话沟通：${result}；${note}`});if(next!=='不创建任务')upsert(state.tasks,{id:`task-call-${l.id}`,title:next,customer:l.name,due:next.includes('T+2')?'后天 10:00':'待安排',status:'待办',owner:'张经理'})}}state.events.push({time:'刚刚',text:`完成外呼：${activeCall.customer}，${result}`,type:'通话'});save();activeCall=null;closeModal();if(!quiet){toast('通话已归档','录音、转写、质检分和跟进任务已同步');navigate('calls')}}

    function advanceOpp(id,quiet=false,targetStage){const o=state.opportunities.find(x=>x.id===id);if(!o)return;const stages=['需求确认','方案设计','方案报价','合同审批','赢单'];let idx=stages.indexOf(o.stage);o.stage=targetStage||stages[Math.min(idx+1,stages.length-1)];o.probability=[30,45,65,82,100][stages.indexOf(o.stage)];if(o.stage==='赢单'){const suffix=o.id.replace('o-','').toUpperCase();upsert(state.contracts,{id:`h-${o.id}`,customer:o.customer,no:`HT-2026-${suffix}`,amount:o.value,status:'已签订',date:'2026-07-19'});upsert(state.orders,{id:`od-${o.id}`,customer:o.customer,no:`OD-2026-${suffix}`,product:o.product,amount:o.value,status:'待交付'});const c=state.customers.find(x=>x.id===o.customerId);if(c)c.status='成交客户';state.events.push({time:'刚刚',text:`赢单结单：${o.customer}，合同 ${money(o.value)}`,type:'赢单'})}save();if(!quiet){toast(`商机已推进至“${o.stage}”`,o.stage==='赢单'?'合同与订单已自动生成':'成交概率已重新计算');render()}}
    function recordPayment(id,quiet=false){const o=state.opportunities.find(x=>x.id===id);if(!o)return;advanceOpp(id,true,'赢单');const h=state.contracts.find(x=>x.id===`h-${o.id}`);upsert(state.payments,{id:`p-${o.id}`,customer:o.customer,contract:h.no,amount:Number((o.value*.5).toFixed(1)),date:'2026-07-19',status:'已到账'});if(h)h.status='履约中';state.events.push({time:'刚刚',text:`首付款到账：${o.customer} ${money(o.value*.5)}`,type:'回款'});save();if(!quiet){toast('回款登记成功','工作台、合同和客户画像已同步');navigate('payments')}}
    function openLead(id){const l=findLead(id);if(!l)return;selectedLeadId=id;const modal=document.getElementById('modal');modal.innerHTML=`<div class="modal-head"><div><h2>${esc(l.name)}</h2><div class="subline">${esc(l.city)} · ${esc(l.district)} · ${esc(l.industry)}</div></div><button class="close" data-close>×</button></div><div class="modal-body"><div class="modal-grid"><div class="info-box"><label>成立日期（公开）</label><strong>${esc(l.date)}</strong></div><div class="info-box"><label>公开信息来源</label><a class="source-link" href="${esc(l.source)}" target="_blank" rel="noopener">打开来源页面 ↗</a></div><div class="info-box"><label>模拟联系人</label><strong>${esc(l.contact)} · ${esc(l.phone)}</strong></div><div class="info-box"><label>线索评分 / 预计价值</label><strong>${l.score}分 · ${money(l.value)}</strong></div><div class="info-box"><label>推荐产品</label><strong>${esc(l.product)}</strong></div><div class="info-box"><label>当前状态</label><strong>${esc(l.status)} · ${esc(l.owner)}</strong></div></div><div class="signal"><b>需求信号（模拟）：</b>${esc(l.signal)}<br><span class="tag green">公开主体</span><span class="tag amber">模拟需求</span><span class="tag blue">${esc(l.product)}</span></div><h3>跟进时间线</h3><div class="timeline">${(l.followups||[]).map(f=>`<div class="time-item"><h4>${esc(f.time)}</h4><p>${esc(f.text)}</p></div>`).join('')||'<div class="empty" style="padding:14px">尚未产生跟进记录</div>'}</div></div><div class="modal-actions"><button class="btn" data-close>关闭</button>${l.owner==='—'?`<button class="btn btn-primary" data-modal-claim="${l.id}">领取线索</button>`:`<button class="btn" data-modal-follow="${l.id}">记录跟进</button><button class="btn btn-primary" data-convert="${l.id}">转为客户并创建商机</button>`}</div>`;document.getElementById('modalBackdrop').classList.add('show');modal.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal);const c=modal.querySelector('[data-modal-claim]');if(c)c.onclick=()=>{claimLead(c.dataset.modalClaim);closeModal()};const f=modal.querySelector('[data-modal-follow]');if(f)f.onclick=()=>{followLead(f.dataset.modalFollow);openLead(f.dataset.modalFollow)};const cv=modal.querySelector('[data-convert]');if(cv)cv.onclick=()=>convertLead(cv.dataset.convert)}
    function closeModal(){if(activeCall){cancelCall();return}document.getElementById('modal').classList.remove('call-modal');document.getElementById('modalBackdrop').classList.remove('show','demo-call')}
    function genericAction(action,product){if(action==='batchClaim'){leadList(current).filter(l=>l.score>=90&&l.owner==='—').slice(0,3).forEach(l=>claimLead(l.id,true));save();toast('批量领取完成','3条高分线索已分配给张经理');render();return}if(action==='scan'){toast('扫描完成','发现2组疑似重复线索');return}if(action==='merge'){toast('记录已合并','保留最新跟进与来源信息');return}if(action==='quote'){toast('已加入报价单',`${product} 已加入当前方案`);return}if(action==='call'||action==='playCall'){toast('模拟通话已开始','本演示不会拨打真实号码');return}if(action==='checkin'){toast('模拟签到成功','位置：西安高新区客户现场');return}toast('操作已完成','教学演示状态已更新')}
    document.getElementById('modalBackdrop').onclick=e=>{if(e.target.id==='modalBackdrop')closeModal()};
    document.getElementById('resetData').onclick=()=>{if(confirm('确定恢复全部初始教学数据吗？')){state=initialState();save();filters={city:'全部',industry:'全部',status:'全部',q:''};navigate('dashboard');toast('演示数据已重置','现在可以重新手动操作或自动播放')}};

    // 自动演示：使用与手动操作相同的业务函数，默认约 4 分钟。
    const demo={active:false,paused:false,index:0,speed:1,timer:null,snapshot:null,stepMs:24000};
    const demoTarget='xa01', demoOpp='o-xa01';
    const steps=[
      {page:'radar',target:'[data-demo="lead-list"]',title:'发现高价值新设企业',text:'进入“新设企业雷达”，聚焦西安并按评分识别目标企业。企业主体来自公开页面，需求与评分为教学模拟。',act:()=>{filters.city='西安';filters.q='万物千方'}},
      {page:'radar',target:'[data-lead-row="xa01"]',title:'查看企业画像与机会信号',text:'打开目标企业详情，确认成立日期、登记地域、行业，并识别“云计算 + 专线”建设机会。',act:()=>setTimeout(()=>openLead(demoTarget),450)},
      {page:'myleads',target:'[data-demo="lead-list"]',title:'领取线索并分配负责人',text:'客户经理接单，线索从公共雷达进入“我的线索”，系统记录负责人和领取时间。',act:()=>{closeModal();claimLead(demoTarget,true);filters.q=''}},
      {page:'dialer',target:'.call-shell',title:'智能外呼与客户弹屏',text:'发起模拟外呼，系统自动弹出客户画像、需求机会和历史信息；通话中同步展示录音状态、实时转写、AI话术提示和快捷记录。',act:()=>{claimLead(demoTarget,true);setTimeout(()=>{openCallWorkbench({leadId:demoTarget});document.getElementById('modalBackdrop').classList.add('demo-call')},180)}},
      {page:'customers',target:'[data-demo="customers"]',title:'通话归档并转为客户',text:'挂断后，通话记录、录音索引、全文转写、质检分和T+2任务自动归档；资格判断通过后转为正式客户并创建商机。',act:()=>{endCall(true);convertLead(demoTarget,true)}},
      {page:'opportunities',target:'[data-opp="o-xa01"]',title:'设计方案并推进商机',text:'围绕客户需求形成“云计算 + 互联网专线”方案，商机由需求确认推进到方案报价。',act:()=>{advanceOpp(demoOpp,true,'方案报价')}},
      {page:'tasks',target:'[data-demo="tasks"]',title:'T+2天二次跟进',text:'时间快速跳转到 T+2 天。客户经理进行二次跟进，确认预算、技术方案和决策链，并创建报价任务。',act:()=>followLead(demoTarget,true,true)},
      {page:'contracts',target:'[data-demo="contracts"]',title:'生成合同与订单',text:'客户确认方案后，商机进入审批并赢单；系统自动生成合同和订单，销售过程进入交付阶段。',act:()=>advanceOpp(demoOpp,true,'赢单')},
      {page:'payments',target:'[data-demo="payments"]',title:'登记首付款并完成结单',text:'登记50%首付款到账，合同状态更新为履约中，商机完成赢单结单，数据同步到回款与客户画像。',act:()=>recordPayment(demoOpp,true)},
      {page:'dashboard',target:'[data-demo="dashboard"]',title:'经营结果实时回写',text:'回到工作台查看结果：客户、商机、合同、订单和回款指标已同步变化。完整接单—执行—二次跟进—结单流程结束。',act:()=>{filters={city:'全部',industry:'全部',status:'全部',q:''}}}
    ];
    function resetDemoTarget(){state=JSON.parse(JSON.stringify(demo.snapshot||state));save()}
    function startDemo(){if(demo.active)return;demo.snapshot=JSON.parse(JSON.stringify(state));demo.active=true;demo.paused=false;demo.index=0;document.getElementById('demoMask').classList.add('show');document.getElementById('demoControls').classList.add('show');runStep(0)}
    function runStep(index,skipAction=false){clearTimeout(demo.timer);demo.index=Math.max(0,Math.min(index,steps.length-1));const s=steps[demo.index];if(!skipAction)s.act();navigate(s.page);setTimeout(()=>{positionSpotlight(s.target);showDemoCard(s);updateDemoControls();if(!demo.paused&&demo.index<steps.length-1)demo.timer=setTimeout(()=>runStep(demo.index+1),demo.stepMs/demo.speed);else if(demo.index===steps.length-1)document.getElementById('demoToggle').textContent='▶'},520)}
    function positionSpotlight(selector){const spot=document.getElementById('demoSpotlight'),el=document.querySelector(selector);if(!el){spot.classList.remove('show');return}const r=el.getBoundingClientRect(),pad=6;spot.style.left=Math.max(8,r.left-pad)+'px';spot.style.top=Math.max(8,r.top-pad)+'px';spot.style.width=Math.min(innerWidth-16,r.width+pad*2)+'px';spot.style.height=Math.min(innerHeight-16,Math.max(48,Math.min(r.height+pad*2,innerHeight-30)))+'px';spot.classList.add('show');el.scrollIntoView({behavior:'smooth',block:'center'})}
    function showDemoCard(s){const card=document.getElementById('demoCard');card.innerHTML=`<div class="demo-step">自动演示 · 第 ${demo.index+1}/${steps.length} 步</div><h3>${s.title}</h3><p>${s.text}</p>`;const spot=document.getElementById('demoSpotlight').getBoundingClientRect(),preferRight=spot.right+430<innerWidth;card.style.left=preferRight?(spot.right+14)+'px':Math.max(15,Math.min(innerWidth-425,spot.left))+'px';card.style.top=(spot.bottom+220<innerHeight?spot.bottom+12:Math.max(82,spot.top-190))+'px';card.classList.add('show')}
    function updateDemoControls(){document.getElementById('demoProgress').style.width=((demo.index+1)/steps.length*100)+'%';document.getElementById('demoLabel').textContent=`${demo.index+1} / ${steps.length}`;document.getElementById('demoToggle').textContent=demo.paused?'▶':'⏸'}
    function toggleDemo(){demo.paused=!demo.paused;clearTimeout(demo.timer);if(!demo.paused&&demo.index<steps.length-1)demo.timer=setTimeout(()=>runStep(demo.index+1),800);updateDemoControls()}
    function exitDemo(){clearTimeout(demo.timer);demo.active=false;demo.paused=false;['demoMask','demoControls','demoCard','demoSpotlight'].forEach(id=>document.getElementById(id).classList.remove('show'));const keep=confirm('是否保留自动演示产生的客户、商机、合同和回款数据？\n选择“取消”将恢复播放前状态。');if(!keep&&demo.snapshot){state=JSON.parse(JSON.stringify(demo.snapshot));save()}navigate('dashboard')}
    document.getElementById('startDemo').onclick=startDemo;document.getElementById('demoToggle').onclick=toggleDemo;document.getElementById('demoNext').onclick=()=>runStep(demo.index+1);document.getElementById('demoPrev').onclick=()=>{resetDemoTarget();runStep(Math.max(0,demo.index-1))};document.getElementById('demoRestart').onclick=()=>{resetDemoTarget();demo.paused=false;runStep(0)};document.getElementById('demoExit').onclick=exitDemo;document.getElementById('demoSpeed').onchange=e=>{demo.speed=Number(e.target.value);if(!demo.paused)runStep(demo.index,true)};window.addEventListener('resize',()=>{if(demo.active)positionSpotlight(steps[demo.index].target)});
    renderNav();navigate('dashboard');
  })();
  </script>
