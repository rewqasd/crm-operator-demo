<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="两个独立的教学模拟区域：运营商政企 CRM 与云犀功能演示。">
  <title>CRM 教学演示</title>
  <meta name="theme-color" content="#17344f">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="assets/styles.css">
  <script src="assets/js/state.js" defer></script>
  <script src="assets/js/app.js" defer></script>
  <script src="assets/js/crm.js" defer></script>
  <script src="assets/js/yunxi.js" defer></script>
  <script src="assets/js/demos.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-content">跳到主要内容</a>
  <div id="app-shell" data-current-mode="home">
    <aside id="sidebar" aria-label="教学导航">
      <div class="brand"><span class="brand-mark" aria-hidden="true">C</span><strong>CRM</strong></div>
      <nav id="mode-navigation" aria-label="当前区域导航">
        <button type="button" class="nav-item active" data-home>教学首页</button>
      </nav>
      <p class="sidebar-note">独立场景 · 本地保存<br>仅用于课堂教学</p>
    </aside>
    <div class="main">
      <header class="topbar">
        <h1>CRM 教学演示</h1>
        <button type="button" class="btn" data-demo-select>自动演示</button>
        <button type="button" class="btn btn-reset" data-reset-domain hidden></button>
        <span class="simulation-badge">全站数据均为教学模拟</span>
      </header>
      <main id="main-content" tabindex="-1"></main>
    </div>
  </div>
  <template id="home-template">
    <section class="home-intro">
      <p class="eyebrow">教学工作台</p>
      <h2>选择一个教学场景</h2>
      <p>CRM 业务流程与云犀产品功能是两个独立教学区，各自保存、各自重置。</p>
    </section>
    <div class="mode-grid">
      <article class="mode-card">
        <span class="section-label">运营商政企销售</span>
        <h3>CRM</h3>
        <p>围绕线索公海，学习从客户联系到业务成交的管理流程。</p>
        <div class="mode-preview">天津市 · 河东区<br><strong>50 家虚构教学企业</strong><small>筛选领取 · 联系跟进 · 客户成交</small></div>
        <button type="button" class="btn btn-primary" data-crm-page="dashboard">进入 CRM <span aria-hidden="true">→</span></button>
      </article>
      <article class="mode-card yunxi-card">
        <span class="section-label">独立产品功能教学</span>
        <h3>云犀功能演示</h3>
        <p>认识云名片、呼叫控制、AI 数析、AI 助手和 AI 助销的使用场景。</p>
        <div class="mode-preview">五项功能 · 独立数据<br><strong>聚焦产品能力与使用边界</strong><small>手动体验 · 自动导览 · 模拟结果</small></div>
        <button type="button" class="btn btn-secondary" data-yunxi-page="overview">进入云犀功能演示 <span aria-hidden="true">→</span></button>
      </article>
    </div>
    <p class="teaching-note">企业、人物、联系方式及业务过程均为虚构或脱敏模拟，不代表真实客户、真实通话或实际产品效果。</p>
  </template>
  <div id="modal-root" hidden></div>
  <div id="toast-root" role="status" aria-live="polite" aria-atomic="true"></div>
  <section id="demo-controls" aria-label="教学演示控制" hidden></section>
  <noscript>请启用 JavaScript 以使用教学演示。</noscript>
</body>
</html>
